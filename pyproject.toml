[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taiwan-weather"
version = "0.1.0"
description = "台灣天氣預報系統 - 整合中央氣象署 API、FastAPI 與現代化視覺儀表板"
readme = "README.md"
authors = [{ name = "Taiwan Weather Team" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
tw-weather = "taiwan_weather.cli:main"
tw-server = "taiwan_weather.api:start_server"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
